<!-- Dashboard base layout with sidebar — extends base.html -->
{% extends "base.html" %}

{% block sidebar %}
<aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav">
        {% block sidebar_content %}{% endblock %}
    </nav>
</aside>
{% endblock %}

{% block content %}
<main class="main-content">
    <!-- Page Header -->
    <div class="mb-8 animate-in">
        <h1 class="mb-2">{% block page_title %}Dashboard{% endblock %}</h1>
        <p class="text-muted text-sm">{% block page_subtitle %}{% endblock %}</p>
    </div>

    {% block dashboard_content %}{% endblock %}
</main>
{% endblock %}
